# IT-Themensammler - Release aus dem signierten Release-Paket
# Das Paket entsteht auf dem PC des Herausgebers (Erstellen.bat: ZIP mit IT-Themensammler.exe und
# Liesmich.txt, dazu ein mit dem privaten Schluessel signiertes Manifest) und liegt im Ordner
# Release. Der Workflow baut nichts selbst: Er prueft, dass ZIP und Manifest zur Version
# passen (Name, Version, SHA-256 - die Signatur prueft erst das Programm, der Schluessel ist nicht
# auf GitHub), und haengt beide an das Release.
# Ausloeser: neues Manifest im Ordner Release bzw. Aenderung dieser Datei auf main oder per Hand
# ueber "Run workflow" (Eingabe der Versionsnummer). Ohne Eingabe gilt die Version des Manifests
# im Ordner Release.
# Gibt es das Release zur Version schon, wird nur der Text aufgefrischt.

name: Release

on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml, 'Release/*.manifest']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (z. B. 1.32.2026.1121)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version lesen
        id: ver
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $ver = '${{ github.event.inputs.version }}'.TrimStart('v')
          if(-not $ver) {
            $m = @(Get-ChildItem -LiteralPath 'Release' -Filter 'IT-Themensammler-*.manifest' -File -ErrorAction SilentlyContinue)
            if($m.Count -eq 1 -and $m[0].Name -match '^IT-Themensammler-(\d+\.\d+\.\d+\.\d+)\.manifest$') { $ver = $Matches[1] }
          }
          if($ver -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "keine gueltige Version gefunden: $ver" }
          "ver=$ver" >> $env:GITHUB_OUTPUT
          gh release view "v$ver" *> $null
          if($LASTEXITCODE -eq 0) { "exists=1" >> $env:GITHUB_OUTPUT; Write-Host "Release v$ver existiert bereits - nur Text auffrischen" }
          else { "exists=0" >> $env:GITHUB_OUTPUT; Write-Host "Neues Release v$ver" }
          exit 0

      - name: Release-Text erstellen
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $ver = '${{ steps.ver.outputs.ver }}'
          # neuester Commit, dessen Text die Versionsnummer nennt
          $sha = git log --format=%H -F --grep="$ver" -n 1
          $punkte = @()
          if($sha) {
            $punkte = @(git log -1 --format=%B $sha | Where-Object { $_ -match '^\s*- ' } | ForEach-Object { $_.Trim() })
          }
          if($punkte.Count -eq 0) { $punkte = @('- siehe Liesmich.txt') }
          $zeilen = New-Object System.Collections.Generic.List[string]
          $zeilen.Add('## Änderungen'); $zeilen.Add('')
          foreach($p in $punkte) { $zeilen.Add($p) }
          $zeilen.Add('')
          $zeilen.Add('## Installation')
          $zeilen.Add('')
          $zeilen.Add("1. ``IT-Themensammler-$ver.zip`` herunterladen und in einen eigenen Ordner auf dem Server entpacken.")
          $zeilen.Add('2. `IT-Themensammler.exe` starten (fragt nach Administratorrechten) und unter „Admin-Konten“ mindestens ein Konto anlegen.')
          $zeilen.Add('3. Bei Bedarf den Port ändern (Standard 8080), unter „Aussehen“ in der Weboberfläche E-Mail und Hotline für dringende Probleme eintragen.')
          $zeilen.Add('4. „Dienst einrichten“ wählen: Das Programm wird nach `C:\Program Files\IT-Themensammler` kopiert und läuft als Windows-Dienst. Die angezeigte Adresse (z. B. `http://server:8080/`) an die Mitarbeiter geben.')
          $zeilen.Add('')
          $zeilen.Add('Neue Version: Das Verwaltungsfenster zeigt sie oben an; „Jetzt aktualisieren“ tauscht Programm und Dienst aus. Alternativ die neue EXE starten und „Dienst aktualisieren“ wählen.')
          $zeilen.Add('')
          $zeilen.Add("Signatur: ``IT-Themensammler-$ver.manifest`` ist die signierte Prüfsumme des ZIP. Das Programm installiert Updates nur, wenn diese Signatur gültig ist.")
          $zeilen.Add('')
          $zeilen.Add('Voraussetzung: Windows 10/11 oder Windows Server mit .NET Framework 4.x. Ausführliche Beschreibung (Domänen-Anmeldung, Active Directory, Microsoft 365) und Versionsgeschichte: `Liesmich.txt` im ZIP.')
          [IO.File]::WriteAllText("$PWD\notes.md", ($zeilen -join "`n"), (New-Object System.Text.UTF8Encoding($false)))
          Get-Content notes.md -Encoding utf8

      - name: Release-Paket pruefen
        if: steps.ver.outputs.exists == '0'
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.ver }}'
          $zip = "Release\IT-Themensammler-$ver.zip"
          $man = "Release\IT-Themensammler-$ver.manifest"
          if(-not (Test-Path -LiteralPath $zip)) { throw "Im Ordner Release fehlt $zip" }
          if(-not (Test-Path -LiteralPath $man)) { throw "Im Ordner Release fehlt $man" }
          $bytes = [IO.File]::ReadAllBytes($man)
          if([Array]::IndexOf($bytes, [byte]13) -ge 0) { throw 'Das Manifest enthaelt CR (Zeilenende muss LF sein, sonst passt die Signatur nicht)' }
          $werte = @{}
          foreach($z in ([Text.Encoding]::UTF8.GetString($bytes) -split "`n")) { if($z -match '^([A-Za-z0-9]+)=(.*)$') { $werte[$Matches[1]] = $Matches[2] } }
          if($werte['Programm'] -cne 'IT-Themensammler') { throw "Manifest: Programm ist '$($werte['Programm'])'" }
          if($werte['Version'] -cne $ver) { throw "Manifest: Version ist '$($werte['Version'])', erwartet $ver" }
          if($werte['Datei'] -cne "IT-Themensammler-$ver.zip") { throw "Manifest: Datei ist '$($werte['Datei'])'" }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($werte['SHA256'] -cne $hash) { throw "Manifest: SHA256 passt nicht zum ZIP ($hash)" }
          if(-not $werte['Signatur']) { throw 'Manifest: Signatur fehlt' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $zip).Path)
          try { $namen = @($z.Entries | ForEach-Object { $_.FullName }) } finally { $z.Dispose() }
          if($namen -notcontains 'IT-Themensammler.exe') { throw 'Im ZIP fehlt IT-Themensammler.exe' }
          Write-Host "Release-Paket in Ordnung: $($namen -join ', ') - SHA256 $hash, Schluessel $($werte['Schluessel'])"

      - name: Release anlegen
        if: steps.ver.outputs.exists == '0'
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.ver }}'
          gh release create "v$ver" "Release\IT-Themensammler-$ver.zip" "Release\IT-Themensammler-$ver.manifest" --title "IT-Themensammler $ver" --notes-file notes.md --target $env:GITHUB_SHA

      - name: Release-Text auffrischen
        if: steps.ver.outputs.exists == '1'
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.ver }}'
          gh release edit "v$ver" --notes-file notes.md
